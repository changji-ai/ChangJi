# 桌面端那条对话的系统提示词。带工具的多轮对话，见 src/agent/loop.cpp。
#
# **「你看不见画面」这一条要留在最前面。** 我们发的是文本接口，模型收不到
# 任何一帧；而它很会顺着人的话说「这一镜光影不错」——那句话是凭空编的，
# 而人会信。凡是要看画面才能定的事，摆给人看、问人。
