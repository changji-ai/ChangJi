revise_head = """


【你上一稿】下面是你刚写的这一章（已经按上面的规矩清理过），形状和要交的 JSON 一样：
"""

revise_problems_head = """

【要改的地方】审稿只挑出下面这几处，没列出来的都过了：
"""

revise_tail = """
只改上面点到的地方：说的是第几场就只在那一场里改，没点到的段落一个字都不要动，人物、地点、每一场的 where / pov / who / goal / obstacle / worse / turn 都照旧。改完仍然要交出**完整的一章**，形状和上一稿一样。
