# ---- 2026-09-12 重写：从「一堆段落」改成「几场戏」----
#
# 上一版的产物用户的判词是「只能叫剧本不能叫故事/小说」。实测那一章
# （chapter_check8 / ch02，1674 字）把重逢、决裂、离开、回来、和好五件事
# 全写完了，每一段推进一整个事件——叙事学上这叫**概述**（叙述时长远短于
# 故事时间）。小说读起来是小说靠的是**场景**：叙述时长约等于故事时间，
# 一个动作一段、一句对白一段。
#
# 上一版的三条规则直接造出了这个结果：
#   · schema 里写着「一段一两句话、三四十个字」+ 段数 = 字数/35
#     → 数学上就规定了每段 35 字的字幕体；
#   · 「不要写替读者解释心理和意义的旁白」→ 模型理解成「不许写内心」，
#     于是只剩「神情复杂」「心中涌起难以言喻的情绪」这类情绪标签；
#   · 「不要描写长相、发型、服装」→ 扩大成「不要描写人」，人物在场上没有身体。
# 而提示词里从头到尾没有「场」这个单位，模型拿到整章梗概只能平摊。
#
# 现在：一章 = 几场戏，一场 = 一个地方一段时间里，谁想干什么、谁拦着、
# 最后局面变成什么（turn）。turn 就是这一场的收口——**场的边界从此由程序
# 数段落数出来，不再靠模型抄一句原文回来定位**。
#
# 拼接顺序：seg0 + 画风 + seg1 + 场数 + seg1b + 每场字数 + seg2 + rules
#           + [first_head，第一章才有] + context_head + 上下文 + tail
#
# ⚠️ 第 7 条（不靠眼睛的细节）的下限 2026-09-12 从「至少一个」提到「三四处」，
# **那一轮的对照是无效的，别拿它当依据**：改提示词的同一天，机器上的模型
# 也从 Qwen3-14B 换成了 32B（配置 14:52 改的，对照的两跑一个在 14:27、
# 一个在 15:03）。两个变量混在一起，「提上去之后数没动」这个结论不成立。
# 要重做的话，先把模型钉住再改措辞。
[chapter_write]

seg0 = "你在写一部"

hint_realistic = "{{shared.hint_realistic}}"

hint_anime = "{{shared.hint_anime}}"

seg1 = """
的原作小说，现在写其中**一章**的正文。

这一章写成 """

# 场数和每场字数之间。
seg1b = " 场戏，每一场 "

# 「一场戏是…」和「主要产出是正文…不是梗概也不是分镜」这两段 2026-09-16
# 删掉了：scenes 和 paragraphs 两个字段的 description 里逐字就有，而那头
# 贴在字段上、填那一栏时一定读到。只留这儿独有的那一句（场与场之间的空隙）。
seg2 = """
 字上下。场与场之间隔多久都行，隔着的那段时间用一两句带过去。

硬性要求：
"""

# ---- 为什么只剩这些：砍掉的那些不是不要了，是**已经被更硬的东西管着** ----
#
# 这张表原来 25 条 2462 字，其中一大半在复述 schema 字段的描述。而那头是
# **更强的约束**——描述贴在字段上，模型填那一栏的时候一定会读到；正文里
# 第 22 条它读的时候离要用还隔着两千字。项目里早有结论：「管得住 14B 的
# 从来不是措辞，是它没得选」（chapter_write.cpp 里 last_line 抬成字段那段）。
#
# 逐条去处（chapter_write.cpp 里 scene_props 那一段）：
#   1  一段一两秒的事、不是梗概不是分镜  → paragraphs 的描述里逐字就有
#   4  一场里时间连着                    → scenes 的描述：「一段连着的时间里」
#  14  一来一往地写                      → paragraphs：「连着三段没人开口，画面就停住了」
#  21  两场不能停在同一件事上            → worse：「三场都停在同一个僵持上…成片里这三场看着一模一样」
#  22  turn 要拍得出来、脑子里的事不算   → turn 的描述几乎逐字就是这一条
#  25  每一场末尾要留一个往下看的扣      → turn：「它就是这一场的收口，也是把人拉着往下看的那一下」
#
# 另有两条归代码，措辞管不住而函数管得住：
#  18 后半「不要写镜头」→ strip_camera_talk（词表在 chapter_write.cpp）
#  19 同一句不出现第二次 → check_repetition
# 这两条各留了半句：让它一开始就别写，比事后剥掉留下的疤好。
#
# ⚠️ **2026-09-16 实测：「同一句不出现第二次」不能只留半句。** 第一版把它塞在
# 「人物名和下面给的一字不差」那一条的
# 尾巴上，拿 hulian-test ch08 实跑，重复小句 59 处——八章里最高（旧提示词
# 那七章是 5~41）。`风声呼啸`×6、`灰尘在光束里漂浮`×5。
# **代码那道守卫接不住**：check_repetition 和它的摘除都是句级的
# （kRepeatMinSentenceChars ≥ 8 字整句），而重复的是句子**内部**的小句。
# 所以它抬回独立一条（表里那句「**同一个说法一章里只用一次**」），而且写
# 清楚"半句也不行"。**这儿刻意不写条号**：表一砍就重编号，条号会指歪——
# 2026-09-17 重编号那一次，这句原来写着「现在的 16」，当场就错位了。
# 原话是能 grep 的，条号不是（同一条规矩也写在 storyboard.cpp 上）。
# 代价 60 字，买的是这一章少 N 处复读——这条是砍不动的。
#
# **留下来的判据只有一条**：schema 和守卫都管不着，而且砍了会真变差。
# 讲道理的话一律搬到这些 # 注释里——模型收不到 # 开头的行。
#
# 2026-09-17 又砍掉一条（原 14「【地方】是整个故事的清单，用得着哪一两个
# 就只写那一两个」）：那是**拿措辞去治一个"给多了"造成的问题**。二十个地方
# 摆在眼前，模型自然会用。章自己带着 locations 名单（读故事那条路上它在
# required 里、minItems 1），照它筛就是了——上下文小一截，规则也不用写。
# 筛不出来（大纲那条路上这一栏可空）才给全份，那时候把这句提醒贴在名单
# 旁边：**贴在名单上比写在两千字之前的规则表里管用**。见
# stages/chapter_write.cpp 里【地方】那一段。
#
# 2026-09-17 按补全后的判据（**字段描述只管得住那一栏**，见 story_analyze
# 那张表上的说明）把上面六条重核了一遍：它们各自管的正是自己那一栏
# （1 和 14 管 paragraphs、4 管 scenes、21 管 worse、22 和 25 管 turn），
# 描述就贴在那一栏上，砍法成立，一条都不用加回来。
rules = """

**一、写场面，不写概述。这一条是全部里最要紧的。**
1. 下面【这一章】里的事不止一件。**挑最要紧的几件，一件一场，实时地写**，
   剩下的一两句推过去。一场的字数靠对白往返和感官细节撑起来，不是靠多塞
   几件事——写短了就回去把那场戏演完整，多塞事件只会又变回概述。
2. 每一场开头先落地：在哪、什么时候、什么光、谁在场、手上正在做什么。

**二、一场只跟着一个人走。**
3. pov 那个人心里想什么可以写；**别人心里想什么一个字都不能写**，只能从
   外面看见。一场里进两个人的脑子，读者立刻出戏。
4. 内心写成身体，和他此刻真在想的那件具体的事。下面这些词一个都不要用：
   {{shared.emotion_labels_zh}}。

**三、看得见、听得见、摸得着。**
5. **不靠眼睛的细节，一场里要有三四处，散在不同的段落里**：一个声音、
   一股味道、一个温度、一下触感、手上的一点疼。只在开头写一句味道、后面
   再不提，读者早就忘了自己在哪儿。
6. 东西要具体到看得见：「一件信物」这种类目名不算数，写出它的材质、哪儿
   磨坏了、谁留下的。地方也一样，写出这一处独有的那样东西。
7. 别堆形容词。一个准确的名词加一个准确的动词，顶十个形容词。
8. **不要写长相、发型、服装的款式和颜色**——那由后面美术那一步统一定，
   这里写了两边必然对不上。但**身体要在场**：手在干什么、隔多远、声音哑
   不哑、衣服湿没湿、坐着还是站起来了。

**四、对白。**
9. 对白用 “” 双引号，谁说的和说了什么放在同一段。**说话的人要有名字**，
   就是人物表里那个名字；「有人说」「那边传来熟悉的声音」不行，那句台词
   会变成没有主人的旁白。
10. 不要每一句都「某某说」，用动作把话带出来。
11. 话里要留东西——答非所问、说半句、扯到别处，都比说破了更像真人。
   **留的是什么，看人物表里「他怕的是」那一条。**

**五、只写这一章。**
12. 后面几章的事一个字都不要提前写；前情提要里的事已经发生过，不重演。
   从上一章停下的地方接着走。
13. 人物表里写了每个人「会从什么变成什么」。**那个变化要写成行为**：同一
   种处境下这一次的选择和上一次相反，不要让谁开口说自己变了。
14. 人物名和下面给的一字不差，不要冒出没在人物表里的人。不要写镜头
   （「镜头拉远」「画面切到」「特写」是分镜的话，不是小说的话）。
15. **同一个说法一章里只用一次。** 同一句话、同一个动作不要写第二遍，
   半句也不行——「风声呼啸」「灰尘在光束里漂浮」这种顺手的短语，写过一次
   就换一个说法，哪怕它很贴切。
16. **一章里最多一场没人说话，而且不能是第一场。** 连着两场没人说话，
   成片里就是一大段默片：只有画面，没有一句人声。

**六、每一场停在它的 turn 上。**
17. last_line 里不要出现「终于」「从此」「明白了」「放下了」「释然」这类
   回头总结的说法——它们一出现，悬念当场就被填平了。
18. turn 那一栏写的是**这件事的说法**，不是让你抄进正文的句子。用一个动作、
   一句台词把它写出来，别把那行字原样搬进 paragraphs。

"""

# 第一章没有前情、没有上一章的结尾，提示词短一大截，实跑时 14B 两次都只写出
# 一百来个字。给它一个明确的起点，别让那个位置空着。
first_head = """

【这是第一章】故事从这儿开始，**读者对这些人一无所知**。
· 第一场直接进场面：在哪、谁在、正在做什么。不写题记、不写引言。
· **开头几段之内就要有人开口。** 实测第一章的对白总是全书最少的——
  没有前情可接，模型就一个人在那儿看和想。而读者认人靠的是听他们说话，
  一整章只有叙述，人物立不起来。
· **谁是谁、谁和谁什么关系，靠他们怎么称呼对方、怎么接话带出来**，
  不要用一句叙述挑明（「谁和谁曾经是什么」那种句子）——那种句子一出现，
  读者就从戏里被拎出来了。
"""

context_head = """
下面是这部电影的底子和这一章要写的内容。

"""

# **「不要解释」不够，要说清楚不许把思考写进哪儿。**
#
# 2026-09-12 用户贴回来一段实际输出：模型不是在 JSON 外面加解释，而是把
# 思考编成**键名**塞进 JSON 里——
#     last_line_ending_context_hint_for_model_only_not_outputted_but_used_to…
#     turn_description_internal_note_do_not_output_as_text_field_value_directly…
# 还有一句中文的「[此处需重新生成符合逻辑的第二场内容…我将直接提供正确的
# 完整JSON输出]」，然后垮成一串没完没了的下划线词表。
#
# 前一种绕过了「不要任何解释文字」——它确实没在 JSON 外面写字；后一种是
# 它想推翻重来。两种都要点名。
#
# 根子是 Qwen3.8 这类带推理的模型：思考被 <think></think> 堵住之后并没有
# 消失，而 GBNF 只允许它输出 JSON，于是思考被挤进键名和字符串里。
# （这段输出引用的是「rule 23」，所以它发生在 25 条那一版上——
#  和规则条数无关，砍规则治不了它。）
tail = """


只输出符合下方 JSON Schema 的对象。不要在 JSON 外面加任何字，
也不要在字段值中加入计划、备注、自评或重写说明；写岔时继续完成当前对象。"""

# ---- 改稿：闸门打回时不重掷，把坏在第几处回给模型 ----
#
# 2026-09-19 之前，守卫打回一章的处理是把**同一份提示词再发一遍**——
# chapter_write.cpp 复读那段的原话：「整章作废，而重试只是再掷一次骰子」。
# 而守卫手里明明有坏在第几场、是哪句（「第 2 场和第 3 场停在同一件事上」
# 「「神情复杂」×3」），那些字一直只给人看，没给过模型。
#
# 改稿这一份 = 原来那份写章的提示词（一字不少）+ 上一稿 + 毛病清单 + 下面
