# Desktop releases.
#
#   push a branch (not main)  → rolling prerelease, **always on the same
#                               `desktop-beta` tag**
#   push a `desktop-v*` tag   → a proper release
#   run by hand               → same, also beta
#
# ⚠️ **It does not share a Release with `release.yml`.** That `beta` belongs to
# the engine and holds a pile of `changji-<os>-x64-<backend>` archives; drop a
# desktop `.dmg` in among them and whoever is downloading cannot tell whether
# the two are the same thing. So the desktop app gets its own pipeline and its
# own tag.
#
# ⚠️ **`main` is excluded.** No rolling desktop beta on the trunk (the user's
# decision) — what belongs on that branch is tagged releases.
#
# ⚠️ **`workflow_dispatch` alone is not enough.** Manual triggering **only works
# for workflows that exist on the default branch**: while this file was still on
# a feature branch it was not visible on the Actions page at all (hit for real
# on 2026-09-21: after pushing, `actions/workflows` listed only `release.yml`
# and `cloud-tool.yml`). The `push` trigger is not branch-specific, so it runs
# wherever it is pushed.
#
# The cost, stated plainly: one run installs Qt and builds sd.cpp and
# llama.cpp — tens of minutes per platform, three platforms. The macOS cell
# also sends a package to Apple for notarisation, another ten to fifteen
# minutes. **Editing one line of QML triggers all of it.** To build without
# publishing, use `[skip ci]`.
#
# The engine pipeline still has its own `desktop-build` cell that compiles
# `changji-desktop` on all three platforms. **That one compiles and does not
# package** — the desktop shell has per-platform code (`keep_awake.cpp` is
# three different implementations), and red there beats finding out at release
# time.
#
# ---
#
# The three packaging scripts (`desktop/package_{macos,windows,linux}.*`) are
# **the same ones used locally**: however you package by hand is how CI
# packages. Write it twice and CI goes green while the package on your desk is
# broken (or the reverse), and that kind of mistake surfaces only when somebody
# complains. Why each step does what it does, and which traps it walked into,
# is written in those scripts, not repeated here.
#
# **Signing and notarisation need these five secrets** (without them the build
# falls back to an ad-hoc signature and no notarisation — good enough to try
# yourself, but a user downloading it sees "is damaged and can't be opened"):
#
#     MACOS_CERT_P12 / MACOS_CERT_PW          Developer ID certificate (.p12, base64)
#     MACOS_NOTARY_KEY / _KEY_ID / _ISSUER    App Store Connect .p8 (base64)
#
# and, like every workflow in this repository, `CHANGJI_PRODUCT_TOKEN` to read
# the private product repo, which is where `desktop/` lives.

name: Desktop release

on:
  push:
    # **main is excluded**; every other branch is included.
    branches-ignore: ['main']
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      product_ref:
        description: 'Which ref of the private product repo to build against. Blank = its default branch'
        type: string
        required: false
      version:
        description: 'Version (goes into filenames and the Release title). Blank derives it from the branch'
        type: string
        required: false

permissions:
  contents: write

# The product ref is part of the group; see the note in release.yml. Without
# it, the same engine branch built against two different product branches
# counts as one run and the second cancels the first.
concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.product_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # What this run is called and which tag it publishes to. **Worked out once,
  # read everywhere below** — scattering `if: startsWith(github.ref, ...)`
  # around means four places to edit for one change.
  meta:
    name: Where this run goes
    runs-on: ubuntu-24.04
    outputs:
      product_ref: ${{ steps.pref.outputs.ref }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      # ---- Decide which ref of the product repo to use, before checking out ----
      #
      # ⚠️ **Without this you get that repository's default branch.** Push a
      # feature branch here and what gets built is the product repo's main —
      # its web UI, its desktop shell — **and everything looks normal; nothing
      # anywhere says which sources went in.** That is how this pipeline
      # behaved the day it moved here, 2026-09-22.
      #
      # The rule is **pair by name**: a push of `v2.2-desktop` here takes a
      # branch of the same name over there if one exists, and otherwise falls
      # back to that repo's default branch — **saying so**, rather than
      # quietly. An explicit `product_ref` on a manual run wins, and a wrong
      # one fails the job instead of being corrected for you.
      - id: pref
        env:
          GH_TOKEN: ${{ secrets.CHANGJI_PRODUCT_TOKEN }}
          WANT: ${{ inputs.product_ref }}
        run: |
          set -euo pipefail
          REPO=integemjack/changji
          # Stop if the default branch cannot be read; do not treat an empty
          # string as the answer. A network blip would otherwise surface below
          # as "that branch does not exist", and chasing that sentence leads
          # nowhere.
          default=""
          for i in 1 2 3; do
            default=$(gh api "repos/$REPO" --jq .default_branch 2>/dev/null || true)
            [ -n "$default" ] && break
            sleep 2
          done
          [ -n "$default" ] || { echo "::error::cannot read the default branch of $REPO (network? token?)"; exit 1; }

          # **"Absent" means 404 or 422, and nothing else.**
          #
          # ⚠️ `/commits/{ref}` answers **422** for a ref it does not
          # recognise, not 404 (measured: `no-such-thing` and `bad ref!!`,
          # both 422, twice each). Accepting only 404 would turn every
          # not-yet-existing branch name into a hard failure and make the
          # fallback path unreachable. This endpoint is used because it
          # resolves tags too; `/branches/` answers a cleaner 404 but knows
          # only branches.
          #
          # 401/403/5xx all stop: treating those as "absent" would quietly
          # fall back to the default branch and build a different version,
          # with everything looking fine.
          has() {
            local code
            code=$(gh api "repos/$REPO/commits/$1" --silent -i 2>/dev/null | head -1 | awk '{print $2}')
            case "$code" in
              200)     return 0 ;;
              404|422) return 1 ;;
              "")      echo "::error::no answer asking $REPO for $1 (network?)"; exit 1 ;;
              *)       echo "::error::asking $REPO for $1 returned HTTP $code — not 404/422,"
                       echo "so it does not mean absent. Treating it as absent builds another version."; exit 1 ;;
            esac
          }

          if [ -n "$WANT" ]; then
            has "$WANT" || { echo "::error::$REPO has no $WANT"; exit 1; }
            ref="$WANT"
          elif has "$GITHUB_REF_NAME"; then
            ref="$GITHUB_REF_NAME"
          else
            echo "::notice::$REPO has no $GITHUB_REF_NAME; falling back to its default branch $default"
            ref="$default"
          fi
          echo "product repo: $REPO@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Two checkouts; see the meta job in release.yml for the full reasoning.
      # ⚠️ **`fetch-depth: 0` on this repo**: the version is *counted*
      # (`cpp/tools/version.sh`), and a single-commit clone counts 0, silently.
      - name: Check out the product repo
        uses: actions/checkout@v4
        with:
          repository: integemjack/changji
          token: ${{ secrets.CHANGJI_PRODUCT_TOKEN }}
          # Empty means that repo's default branch, which is what a push to
          # THIS repo wants. A push to the product repo passes its own ref
          # through, or a branch there would silently be built against main.
          ref: ${{ steps.pref.outputs.ref }}
          path: changji
      - name: Lay this repo's core over changji/cpp
        shell: bash
        run: rm -rf changji/cpp
      - uses: actions/checkout@v4
        with:
          path: changji/cpp
          fetch-depth: 0

      - id: v
        env:
          WANT: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # `desktop-v1.2` → version `v1.2`, tag unchanged.
            echo "tag=${GITHUB_REF_NAME}"            >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#desktop-}" >> "$GITHUB_OUTPUT"
            echo "channel=release"                   >> "$GITHUB_OUTPUT"
          elif [ -n "$WANT" ]; then
            echo "tag=desktop-${WANT}" >> "$GITHUB_OUTPUT"
            echo "version=${WANT}"     >> "$GITHUB_OUTPUT"
            echo "channel=release"     >> "$GITHUB_OUTPUT"
          else
            # **Always the same tag**: a branch push is a rolling prerelease and
            # the last push wins.
            #
            # The version comes from the prefix in CMake (same as the engine
            # pipeline; the rule lives in `cpp/tools/version.sh`) with the
            # branch name appended — the same commit may have been built on two
            # branches. Slashes become dashes, since this ends up in filenames.
            echo "tag=desktop-beta" >> "$GITHUB_OUTPUT"
            echo "version=$(sh changji/cpp/tools/version.sh)-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  webapp:
    needs: meta
    uses: ./.github/workflows/webapp.yml
    secrets: inherit
    with:
      product_ref: ${{ needs.meta.outputs.product_ref }}

  # All six, because the desktop app now ships every one of them — and the
  # macOS package is **universal**, so that one cell alone needs both the
  # arm64 and the x86_64 static library.
  openssl:
    uses: ./.github/workflows/openssl.yml
    with:
      # windows-arm64 不在里头：那两格停了（见下面矩阵里那段）。引擎那条线
      # 还在编它，所以那一档的缓存照样有人用。
      keys: '["linux-x64","linux-arm64","macos-arm64","macos-x64","windows-x64"]'

  build:
    name: Package ${{ matrix.target }}
    needs: [meta, webapp, openssl]
    runs-on: ${{ matrix.runner }}
    # 360 is GitHub's ceiling. A CUDA cell rebuilds the several hundred ggml
    # .cu files once per architecture in CUDA_ARCH and really does approach it.
    timeout-minutes: 360
    env:
      CHANGJI_VERSION: ${{ needs.meta.outputs.version }}

      # Pinned the same way as the engine pipeline; the reasoning for each of
      # these lives there. 13.2 and not newer because `cuda-cccl` stops at
      # 13-2 in NVIDIA's ubuntu2204 repository, and 75-virtual at the bottom
      # is the PTX fallback for every card not listed.
      CUDA_ARCH: '75-virtual;86-real;89-real;120-real'
      CUDA_APT: '13-2'
      CUDA_DIR: '/usr/local/cuda-13.2'
      CUDA_WIN_VER: '13.2.2'
      CUDA_WIN_COMP: '13.2'
    strategy:
      fail-fast: false
      matrix:
        # ---- Eleven cells: three systems × two architectures × the backends
        #      each of them can actually have ----
        #
        # `ssl` names the OpenSSL artifact to pull; it is not always `target`,
        # because several targets share one architecture's library and the
        # macOS cell needs two.
        #
        # `qthost` / `qtarch` are passed to install-qt-action explicitly. It
        # guesses from the runner, and on `ubuntu-22.04-arm` and
        # `windows-11-arm` the guess is the x86_64 package — which installs,
        # and then fails at link time with an error about object file
        # architecture that says nothing about Qt.
        #
        # ⚠️ **Two combinations are missing because the vendors do not ship
        # them, not because they were skipped.** Checked on 2026-09-22:
        #
        #   windows-arm64 + CUDA   NVIDIA publishes no CUDA for Windows on ARM.
        #                          The installer URL pattern that exists for
        #                          x64 returns 404 for arm64, and there is no
        #                          windows_arm64 package repository.
        #   linux-arm64 + Vulkan   LunarG's Ubuntu repository has binary-amd64
        #                          and binary-i386 and no binary-arm64 (404),
        #                          so there is no packaged `glslc`, which
        #                          ggml-vulkan needs before it can build.
        #
        # Both were probed rather than assumed. If either vendor starts
        # shipping, adding the row is the only change needed.
        include:
          # macOS: one universal package, Metal built in. See the build step
          # for why it is compiled twice and lipo'd rather than configured
          # with two architectures at once.
          - { target: macos-universal,    runner: macos-15,         gpu: metal,  qthost: mac,           qtarch: clang_64 }

          - { target: windows-x64,        runner: windows-2022,     gpu: cpu,    qthost: windows,       qtarch: win64_msvc2022_64,    ssl: windows-x64,   vsarch: x64 }
          - { target: windows-x64-cuda,   runner: windows-2022,     gpu: cuda,   qthost: windows,       qtarch: win64_msvc2022_64,    ssl: windows-x64,   vsarch: x64 }
          - { target: windows-x64-vulkan, runner: windows-2022,     gpu: vulkan, qthost: windows,       qtarch: win64_msvc2022_64,    ssl: windows-x64,   vsarch: x64 }

          # ⚠️ **Windows on ARM is off, 2026-09-22 — the app crashes on open.**
          #
          # These two cells got all the way through: it compiled, windeployqt
          # collected Qt, the installer was written. Then the package refused
          # to start:
          #     it does not open outside the build tree (exit code -1073741819)
          # `-1073741819` is `0xC0000005`, an access violation. So the failure
          # is the product, not the pipeline, and shipping the package would
          # hand somebody an installer whose app dies on the first double-click.
          #
          # Finding out why needs a crash dump from an arm64 Windows machine,
          # which CI does not provide. **Turned off rather than left red**, on
          # the user's call: a permanently red cell stops meaning anything, and
          # a green pipeline that ships a dead package is worse.
          #
          # The arm64 Windows **engine** package is unaffected and still built
          # by release.yml — it has no Qt and no window.
          #
          # To bring them back, uncomment; everything else is still in place
          # (Qt has win64_msvc2022_arm64, LunarG has the /warm/ SDK, and
          # clang-cl is required because llama.cpp's ggml-cpu says outright
          # "MSVC is not supported for ARM, use clang").
          #
          # - { target: windows-arm64,        runner: windows-11-arm, gpu: cpu,    qthost: windows_arm64, qtarch: win64_msvc2022_arm64, ssl: windows-arm64, vsarch: ARM64, toolset: ClangCL }
          # - { target: windows-arm64-vulkan, runner: windows-11-arm, gpu: vulkan, qthost: windows_arm64, qtarch: win64_msvc2022_arm64, ssl: windows-arm64, vsarch: ARM64, toolset: ClangCL }

          - { target: linux-x64,          runner: ubuntu-22.04,     gpu: cpu,    qthost: linux,         qtarch: linux_gcc_64,         ssl: linux-x64 }
          - { target: linux-x64-cuda,     runner: ubuntu-22.04,     gpu: cuda,   qthost: linux,         qtarch: linux_gcc_64,         ssl: linux-x64 }
          - { target: linux-x64-vulkan,   runner: ubuntu-22.04,     gpu: vulkan, qthost: linux,         qtarch: linux_gcc_64,         ssl: linux-x64 }

          # ⚠️ **24.04 here, while every other Linux cell is on 22.04.**
          #
          # Qt's arm64 Linux binaries are built against a newer base than its
          # x86_64 ones. On ubuntu-22.04-arm (glibc 2.35) even Qt's own
          # `qmlimportscanner` refuses to start:
          #     libstdc++.so.6: version `GLIBCXX_3.4.32' not found
          #     libm.so.6: version `GLIBC_2.38' not found
          # and CMake reports it as "Failed to scan target for QML imports",
          # which says nothing about glibc. The x64 cells on 22.04 are fine —
          # measured on 2026-09-22, both in the same run.
          #
          # **The consequence is real and is not hidden:** the arm64 Linux
          # desktop package needs glibc ≥ 2.38, so Ubuntu 24.04, Debian 13 or
          # newer. Building it on 22.04 is not an option Qt offers, and
          # building Qt from source for one cell is a different project. The
          # arm64 **engine** package is unaffected — it has no Qt and stays on
          # 22.04.
          - { target: linux-arm64,        runner: ubuntu-24.04-arm, gpu: cpu,    qthost: linux_arm64,   qtarch: linux_gcc_arm64,      ssl: linux-arm64 }
          - { target: linux-arm64-cuda,   runner: ubuntu-24.04-arm, gpu: cuda,   qthost: linux_arm64,   qtarch: linux_gcc_arm64,      ssl: linux-arm64 }
    steps:
      # Two checkouts; see the meta job in release.yml. `desktop/` and
      # `webapp/` live in the product repo, so this job cannot run on this
      # repository alone.
      - name: Check out the product repo
        uses: actions/checkout@v4
        with:
          repository: integemjack/changji
          token: ${{ secrets.CHANGJI_PRODUCT_TOKEN }}
          # Empty means that repo's default branch, which is what a push to
          # THIS repo wants. A push to the product repo passes its own ref
          # through, or a branch there would silently be built against main.
          ref: ${{ needs.meta.outputs.product_ref }}
          path: changji
      - name: Lay this repo's core over changji/cpp
        shell: bash
        run: rm -rf changji/cpp
      - uses: actions/checkout@v4
        with:
          path: changji/cpp

      # CHANGJI_LLAMA=ON needs a Python: llama.cpp is patched in place with
      # leejet's extensions after it is fetched, and configure stops dead
      # without an interpreter (same as the engine pipeline).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: bundled-webapp
          path: changji/cpp/src/http/

      # The artifact is named by architecture, not by target: three Windows
      # x64 cells share one library.
      - uses: actions/download-artifact@v4
        if: matrix.target != 'macos-universal'
        with:
          name: openssl-${{ matrix.ssl }}
          path: openssl

      # **The universal macOS build needs both.** They go to separate
      # directories and each pass links against its own; there is no fat
      # static library and no need for one, because the two passes are
      # separate builds that only meet at `lipo`.
      - uses: actions/download-artifact@v4
        if: matrix.target == 'macos-universal'
        with:
          name: openssl-macos-arm64
          path: openssl-arm64
      - uses: actions/download-artifact@v4
        if: matrix.target == 'macos-universal'
        with:
          name: openssl-macos-x64
          path: openssl-x64

      # ⚠️ **`host` and `arch` are given explicitly.** install-qt-action
      # guesses from the runner, and on `ubuntu-22.04-arm` and
      # `windows-11-arm` it guesses the x86_64 package. That installs without
      # complaint and then fails at link time with an object-file-architecture
      # error that says nothing about Qt. Both native packages exist —
      # `linux_gcc_arm64` and `win64_msvc2022_arm64` — and so do both modules
      # on every one of the five host/arch pairs (checked 2026-09-22 with
      # `aqt list-qt <host> desktop --modules 6.8.1 <arch>`).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          host: ${{ matrix.qthost }}
          target: desktop
          arch: ${{ matrix.qtarch }}
          # ⚠️ **qtwebsockets is not optional.** It is a separate module, not
          # part of qtbase — without it `find_package(... WebSockets)` fails at
          # configure time, and this cell was red from the day the desktop
          # shell was added (noticed 2026-09-21: all three platforms reporting
          # Failed to find required Qt component "WebSockets").
          modules: 'qtmultimedia qtwebsockets'
          cache: true

      # ⚠️ **Not `gha-setup-ninja`, and not on Windows at all.**
      #
      # That action has no arm64 Linux build: on `ubuntu-22.04-arm` it fails
      # with `Error: incorrect version detected (bad PATH configuration?)`,
      # which reads like a PATH problem and is really "this platform is not
      # published". Both arm64 Linux cells died there on 2026-09-22, at the
      # step before anything was compiled.
      #
      # Windows does not need ninja: those cells configure with the Visual
      # Studio generator.
      - name: Install ninja (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          else
            brew install ninja
          fi
          ninja --version

      # On Linux, Qt needs a pile of X / GL development packages to link.
      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-xinerama0 libfontconfig1-dev

      # ---- Vendor toolchains, only for the cells that need them ----
      #
      # Lifted from the engine pipeline's build-gpu job, where the comments
      # explain each trap in full. The short version:
      #   · install the individual CUDA packages, never the `cuda` metapackage
      #     (8 GB of nsight and samples)
      #   · on Windows, `crt` and `nvvm` are separate in CUDA 13, and a missing
      #     nvvm surfaces five minutes later as a CMake error about a path
      #   · glslc comes from LunarG's SDK; the distribution's libvulkan-dev has
      #     headers and a loader and no compiler, and the build discovers that
      #     a quarter of an hour in

      # CUDA's intermediates are more than ten gigabytes and a runner has
      # twenty-odd free. Running out shows up as "No space left on device"
      # buried in compiler output, where it reads like a source file failing.
      - name: Free up disk space (Linux, CUDA)
        if: runner.os == 'Linux' && matrix.gpu == 'cuda'
        run: |
          df -h /
          # Leave $AGENT_TOOLSDIRECTORY alone; setup-python installs into it.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      # ⚠️ **arm64 Linux pulls from `sbsa`, not `x86_64`.** Same repository
      # host, different path; NVIDIA does publish the 13-2 series for arm64
      # there (checked 2026-09-22: cuda-nvcc / cudart-dev / cccl / libcublas-dev
      # all at 13.2.86_arm64).
      - name: Install CUDA (Linux)
        if: runner.os == 'Linux' && matrix.gpu == 'cuda'
        run: |
          case "$(uname -m)" in
            aarch64) REPO_ARCH=sbsa ;;
            *)       REPO_ARCH=x86_64 ;;
          esac
          curl -fsSLo /tmp/cuda-keyring.deb \
            "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/${REPO_ARCH}/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cuda-nvcc-${CUDA_APT} cuda-cudart-dev-${CUDA_APT} \
            cuda-cccl-${CUDA_APT} libcublas-dev-${CUDA_APT}
          echo "${CUDA_DIR}/bin" >> "$GITHUB_PATH"
          echo "CUDA_PATH=${CUDA_DIR}" >> "$GITHUB_ENV"
          "${CUDA_DIR}/bin/nvcc" --version

      - name: Install CUDA (Windows)
        if: runner.os == 'Windows' && matrix.gpu == 'cuda'
        shell: pwsh
        run: |
          $url = "https://developer.download.nvidia.com/compute/cuda/$env:CUDA_WIN_VER/network_installers/cuda_${env:CUDA_WIN_VER}_windows_network.exe"
          curl.exe -fL --retry 3 -o cuda.exe $url
          if ($LASTEXITCODE -ne 0) { throw "CUDA installer download failed: $url" }
          $c = $env:CUDA_WIN_COMP
          $comp = @("nvcc","crt","nvvm","cudart","cublas","cublas_dev","thrust",
                    "cuda_profiler_api","visual_studio_integration") |
                  ForEach-Object { "${_}_$c" }
          Start-Process -Wait -FilePath .\cuda.exe -ArgumentList (@("-s") + $comp)
          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$c"
          foreach ($need in @("bin\nvcc.exe", "nvvm\bin\cicc.exe")) {
            if (-not (Test-Path "$cuda\$need")) {
              throw "CUDA installed but $cuda\$need is not there — a component name or the version no longer matches."
            }
          }
          "CUDA_PATH=$cuda" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CUDA_PATH_V$($c -replace '\.','_')=$cuda" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$cuda\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $bc = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\BuildCustomizations"
          $ext = "$cuda\extras\visual_studio_integration\MSBuildExtensions"
          if ((Test-Path $ext) -and (Test-Path $bc)) { Copy-Item "$ext\*" -Destination $bc -Force }

      - name: Install the Vulkan SDK (Linux)
        if: runner.os == 'Linux' && matrix.gpu == 'vulkan'
        run: |
          curl -fsSL https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo curl -fsSLo /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq vulkan-sdk
          glslc --version

      # ⚠️ **arm64 Windows has its own installer, at `/warm/`.** The `/windows/`
      # one is x86_64 and would install a glslc this machine cannot run.
      # LunarG does publish it (checked 2026-09-22, HTTP 200); they do not
      # publish an arm64 Linux package, which is why there is no
      # linux-arm64-vulkan row in the matrix.
      - name: Install the Vulkan SDK (Windows)
        if: runner.os == 'Windows' && matrix.gpu == 'vulkan'
        shell: pwsh
        run: |
          $slug = if ("${{ matrix.vsarch }}" -eq "ARM64") { "warm" } else { "windows" }
          curl.exe -fL --retry 3 -o vulkan-sdk.exe "https://sdk.lunarg.com/sdk/download/latest/$slug/vulkan_sdk.exe"
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK download failed ($slug)." }
          Start-Process -Wait -FilePath .\vulkan-sdk.exe `
            -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install"
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
                 Sort-Object Name | Select-Object -Last 1
          if (-not $sdk) { throw "Vulkan SDK installed but C:\VulkanSDK is empty." }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$($sdk.FullName)\Bin"        | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # ---- Configure and build ----
      #
      # **Same switches as the engine pipeline**: what is inside the desktop
      # app *is* that engine, and leaving one off removes half the features
      # while the interface pages for them sit there as if nothing happened.

      # ⚠️ **The universal macOS build is two builds and a lipo, not one
      # configure with two architectures.**
      #
      # `CMAKE_OSX_ARCHITECTURES="arm64;x86_64"` looks like the obvious way and
      # is wrong here. ggml decides its instruction set in
      # `ggml/cmake/common.cmake`, and that check is `STREQUAL "arm64"` /
      # `STREQUAL "x86_64"` — neither of which a two-value list equals. It
      # falls through to `GGML_SYSTEM_ARCH = UNKNOWN`, none of the per-arch
      # blocks in ggml-cpu match, and **the binary comes out with no NEON and
      # no AVX at all** — correct, several times slower, and silent about it.
      #
      # Measured locally on 2026-09-22 by configuring that one function three
      # times: "arm64" → ARM, "x86_64" → x86, "arm64;x86_64" → UNKNOWN.
      #
      # So each slice is built on its own, with its own OpenSSL, and the two
      # executables are joined at the end. Qt's macOS binaries are already
      # universal, so both link against the same Qt, and macdeployqt copies in
      # frameworks that are fat to begin with.
      - name: Configure + build (macOS universal)
        if: matrix.target == 'macos-universal'
        run: |
          set -euo pipefail
          for a in arm64 x86_64; do
            ssl="$PWD/openssl-arm64"
            [ "$a" = "x86_64" ] && ssl="$PWD/openssl-x64"
            cmake -S changji/cpp -B "build-$a" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="$a" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
              -DGGML_METAL_EMBED_LIBRARY=ON \
              -DCHANGJI_VERSION="$CHANGJI_VERSION" \
              -DCHANGJI_DESKTOP=ON \
              -DCHANGJI_SD=ON \
              -DCHANGJI_LLAMA=ON \
              -DCHANGJI_BUILD_TESTS=OFF \
              -DGGML_NATIVE=OFF \
              -DOPENSSL_ROOT_DIR="$ssl"
            # **Check ggml agreed.** If this ever prints UNKNOWN the slice has
            # no SIMD, and nothing downstream would say so.
            grep -E 'GGML_SYSTEM_ARCH|CMAKE_SYSTEM_PROCESSOR' "build-$a/CMakeCache.txt" || true
            cmake --build "build-$a" --target changji-desktop --parallel
          done

          # Take the arm64 .app as the shell and replace its executable with
          # the fat one. Everything else in the bundle at this point is
          # resources and QML; Qt's own libraries arrive later, from a
          # universal Qt, via macdeployqt.
          rm -rf build && cp -R build-arm64 build
          APP=build/desktop/changji-desktop.app/Contents/MacOS/changji-desktop
          lipo -create \
            build-arm64/desktop/changji-desktop.app/Contents/MacOS/changji-desktop \
            build-x86_64/desktop/changji-desktop.app/Contents/MacOS/changji-desktop \
            -output "$APP"
          got=$(lipo -archs "$APP")
          echo "the executable now carries: $got"
          # Both, or this is not a universal build and half the Macs that
          # download it cannot open it.
          case "$got" in
            *arm64*) ;; *) echo "::error::no arm64 slice"; exit 1 ;;
          esac
          case "$got" in
            *x86_64*) ;; *) echo "::error::no x86_64 slice"; exit 1 ;;
          esac

      - name: Configure + build (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          EXTRA=()
          case "${{ matrix.gpu }}" in
            cuda)   EXTRA+=(-DCHANGJI_SD_CUDA=ON "-DCHANGJI_CUDA_ARCH=$CUDA_ARCH"
                            "-DCMAKE_CUDA_COMPILER=$CUDA_DIR/bin/nvcc") ;;
            vulkan) EXTRA+=(-DCHANGJI_SD_VULKAN=ON) ;;
          esac
          cmake -S changji/cpp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHANGJI_VERSION="$CHANGJI_VERSION" \
            -DCHANGJI_DESKTOP=ON \
            -DCHANGJI_SD=ON \
            -DCHANGJI_LLAMA=ON \
            -DCHANGJI_BUILD_TESTS=OFF \
            -DGGML_NATIVE=OFF \
            -DOPENSSL_ROOT_DIR="$PWD/openssl" \
            "${EXTRA[@]}"
          cmake --build build --target changji-desktop --parallel

      # Windows uses the Visual Studio generator, not Ninja (same as the engine
      # pipeline: Ninja would need vcvarsall.bat first, and the runners do not
      # agree on where VS lives).
      #
      # `[string[]]` and the missing `@` are both required; see the engine
      # pipeline's Windows build for the reproduction. PowerShell unwraps a
      # one-element array into a string, and splatting a string sends it one
      # character at a time.
      - name: Configure + build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ssl = ((Get-Location).Path -replace '\\','/') + "/openssl"
          $tset = "${{ matrix.toolset }}"
          $targs = if ($tset) { @("-T", $tset) } else { @() }
          [string[]]$extra = switch ("${{ matrix.gpu }}") {
            "cuda"   { @("-DCHANGJI_SD_CUDA=ON", "-DCHANGJI_CUDA_ARCH=$env:CUDA_ARCH") }
            "vulkan" { @("-DCHANGJI_SD_VULKAN=ON") }
            default  { @() }
          }
          cmake -S changji/cpp -B build -G "Visual Studio 17 2022" -A ${{ matrix.vsarch }} @targs `
            -DCHANGJI_VERSION="$env:CHANGJI_VERSION" `
            -DCHANGJI_DESKTOP=ON `
            -DCHANGJI_SD=ON `
            -DCHANGJI_LLAMA=ON `
            -DCHANGJI_BUILD_TESTS=OFF `
            -DGGML_NATIVE=OFF `
            -DOPENSSL_ROOT_DIR="$ssl" `
            $extra
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build --config Release --target changji-desktop --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      # ---- The signing certificate (macOS only, and only when the secret is
      #      there) ----
      #
      # Without it the build falls back to an ad-hoc signature: the package
      # runs here, but a user who downloads it sees "is damaged and should be
      # moved to the Bin" — which is why the publish step below refuses to
      # ship one.
      - name: Import the Developer ID certificate
        id: signcert
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PW }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "no MACOS_CERT_P12; this run signs ad-hoc"
            echo "identity=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          KC="$RUNNER_TEMP/sign.keychain-db"; KPW="$(openssl rand -base64 18)"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "${CERT_PW:-}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KC" >/dev/null
          # Put the throwaway keychain into the search list, or codesign cannot
          # find the identity inside it.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          ID=$(security find-identity -v -p codesigning "$KC" | grep -m1 "Developer ID Application" | sed -E 's/.*"(.*)".*/\1/')
          rm -f "$RUNNER_TEMP/cert.p12"
          [ -n "$ID" ] || { echo "this certificate holds no Developer ID Application identity"; exit 1; }
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
          echo "signing as: $ID"

      # ⚠️ **`CHANGJI_PKG_TARGET` decides the filename.** Without it all three
      # scripts fall back to naming by operating system — and eleven cells
      # produce packages whose names collide three and four at a time. The
      # publish job downloads them into one directory, so a collision is a
      # silent overwrite: what ships is labelled "macOS" or "windows" and runs
      # on one architecture or one vendor's card.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          CHANGJI_PKG_TARGET: ${{ matrix.target }}
          CHANGJI_SIGN_ID: ${{ steps.signcert.outputs.identity }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          CHANGJI_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          CHANGJI_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          if [ -n "${NOTARY_KEY:-}" ]; then
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/nkey.p8"
            export CHANGJI_NOTARY_KEY="$RUNNER_TEMP/nkey.p8"
          fi
          bash changji/desktop/package_macos.sh build dist
          rm -f "$RUNNER_TEMP/nkey.p8"

      # **Ask the ticket, not the secrets.**
      #
      # The publish job used to decide "is this notarised?" by testing whether
      # MACOS_CERT_P12 was set. That answers a different question: with a
      # certificate present and the notarisation secrets missing, the dmg is
      # signed, unnotarised, and shipped — and a user still gets the "damaged"
      # dialogue. A `.dmg` **can** carry a stapled ticket (unlike the bare
      # engine binary), so this asks the artifact itself and leaves a marker
      # that the publish job, which runs on Linux and has no stapler, can read.
      - name: Is the dmg really notarized (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls dist/*.dmg 2>/dev/null | head -1 || true)
          [ -n "$dmg" ] || { echo "no dmg came out of packaging"; exit 1; }
          if xcrun stapler validate "$dmg"; then
            echo "ticket is stapled to $(basename "$dmg")"
            : > dist/NOTARIZED
          else
            echo "::warning::$(basename "$dmg") carries no notarisation ticket."
            echo "It will not be published; download it from this run's artifacts to test locally."
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CHANGJI_PKG_TARGET: ${{ matrix.target }}
        run: |
          # NSIS: the runners ship Chocolatey, so one install gets makensis.
          choco install nsis -y --no-progress
          $env:PATH = "$env:PATH;C:\Program Files (x86)\NSIS"
          powershell -ExecutionPolicy Bypass -File changji\desktop\package_windows.ps1 build dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          CHANGJI_PKG_TARGET: ${{ matrix.target }}
        run: bash changji/desktop/package_linux.sh build dist

      # Building a package proves nothing; **it has to be opened from outside
      # the build tree**.
      #
      # This uses the desktop app's own self-test hooks (`CHANGJI_DESKTOP_SHOT`:
      # show yourself, take a screenshot, exit). A missing QML plugin or a
      # missing runtime library does not stop a package from being *built* —
      # those only appear when it actually opens. **Linux has no display**, so
      # xvfb provides one.
      - name: Actually open it (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          QML_DISABLE_DISK_CACHE=1 CHANGJI_DESKTOP_SHOT="$RUNNER_TEMP/shot.png" \
            CHANGJI_DESKTOP_SHOT_MS=12000 \
            dist/changji.app/Contents/MacOS/changji-desktop
          test -s "$RUNNER_TEMP/shot.png" || { echo "it opened, but no screenshot came out"; exit 1; }
          echo "it opens outside the build tree"

      # ⚠️ **The CUDA cells cannot be launched here.** The binary links the
      # driver library (libcuda.so.1 on Linux, nvcuda.dll on Windows), and
      # that comes from the **graphics driver**, not the toolkit — CI has no
      # card and so no driver. The engine pipeline lost a whole round of
      # NVIDIA packages to exactly this on 2026-09-13: the build was fine and
      # one launch line stopped it.
      #
      # So these cells verify that the package was *built*, and not that it
      # opens. That is a real gap and it is stated rather than papered over:
      # a missing QML plugin in a CUDA package would reach a user.
      - name: Actually open it (Linux)
        if: runner.os == 'Linux' && matrix.gpu != 'cuda'
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb
          xvfb-run -a env QML_DISABLE_DISK_CACHE=1 \
            CHANGJI_DESKTOP_SHOT="$RUNNER_TEMP/shot.png" CHANGJI_DESKTOP_SHOT_MS=12000 \
            dist/changji-desktop/changji-desktop
          test -s "$RUNNER_TEMP/shot.png" || { echo "it opened, but no screenshot came out"; exit 1; }
          echo "it opens outside the build tree"

      # ⚠️ **`&` does not wait for a GUI program on Windows, and
      # `$LASTEXITCODE` is never set.**
      #
      # This is a Qt app, so its subsystem is WINDOWS: PowerShell launches it
      # and carries straight on. `$LASTEXITCODE` stays unset, `-ne 0` is
      # therefore true, and the step threw
      #     it does not open outside the build tree (exit code )
      # — with nothing in the brackets. The app had in fact started; its own
      # log lines (`changji 监听 127.0.0.1:59025`) are in the output directly
      # above the error. The check was wrong, not the package.
      #
      # `Start-Process -PassThru` plus `WaitForExit(ms)` waits, yields a real
      # exit code, and puts a ceiling on it: the self-test hook closes the
      # window after CHANGJI_DESKTOP_SHOT_MS, so anything past two minutes is
      # a hang, and a hang should not sit there until the job's 360-minute
      # timeout.
      - name: Actually open it (Windows)
        if: runner.os == 'Windows' && matrix.gpu != 'cuda'
        shell: pwsh
        run: |
          $env:QML_DISABLE_DISK_CACHE = "1"
          $env:CHANGJI_DESKTOP_SHOT = "$env:RUNNER_TEMP\shot.png"
          $env:CHANGJI_DESKTOP_SHOT_MS = "12000"
          $exe = "dist\changji-desktop\changji-desktop.exe"
          if (-not (Test-Path $exe)) { throw "$exe is not there" }
          $p = Start-Process -FilePath $exe -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) {
            $p.Kill()
            throw "it did not exit within two minutes — CHANGJI_DESKTOP_SHOT_MS should have closed it after 12 seconds, so it is hung"
          }
          if ($p.ExitCode -ne 0) { throw "it does not open outside the build tree (exit code $($p.ExitCode))" }
          if (-not (Test-Path "$env:RUNNER_TEMP\shot.png")) { throw "it opened, but no screenshot came out" }
          Write-Host "it opens outside the build tree"

      # **The one thing the CUDA cells can still prove without a card.**
      #
      # "It built" does not mean the backend is in there: a configure that
      # quietly fell back to CPU produces a package that installs, opens and
      # is absurdly slow, with nothing to explain why. The engine pipeline
      # found this for real on 2026-09-10 — five hours for two steps, and
      # nvidia-smi showing no compute process. `strings | grep -c ggml_cuda_`
      # was 0 against 2348, and it needs no GPU.
      - name: Is the backend actually in there
        if: matrix.gpu == 'cuda' || matrix.gpu == 'vulkan'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.gpu }}" in
            cuda)   MARK=ggml_cuda_ ;;
            vulkan) MARK=ggml_vk_ ;;
          esac
          BIN=$(find build -type f -name 'changji-desktop*' \
                  ! -name '*.pdb' ! -name '*.ilk' -size +1M | head -1)
          [ -n "$BIN" ] || { echo "::error::no changji-desktop binary under build/"; find build -name 'changji-desktop*'; exit 1; }
          echo "looking inside $BIN"
          # `strings` is not on the Windows runners; this reads the file the
          # same way and works everywhere.
          N=$(python3 -c "
          import re,sys
          d=open(sys.argv[1],'rb').read()
          print(len(re.findall(sys.argv[2].encode(), d)))
          " "$BIN" "$MARK")
          echo "$MARK appears $N times"
          if [ "$N" -lt 1 ]; then
            echo "::error::**The ${{ matrix.gpu }} backend is not in this build.** It compiled,"
            echo "but it will only ever use the CPU — and a user would see 'it works,"
            echo "but absurdly slowly', with no way to find out why."
            exit 1
          fi

      # Upload only what can be shipped: .dmg / setup.exe / .tar.gz. The
      # unpacked directory (a several-hundred-megabyte .app, changji-desktop\)
      # stays behind — it is an intermediate, and uploading it only invites
      # people to download the wrong thing.
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*setup.exe
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/NOTARIZED
          if-no-files-found: error

  publish:
    name: Publish
    needs: [meta, build]
    runs-on: ubuntu-24.04
    steps:
      # ⚠️ **Not `merge-multiple: true`.** That flattens every artifact into
      # one directory, and two files with the same name become one — the later
      # one wins, silently. With eleven cells that is not hypothetical: the
      # packaging scripts used to name by operating system, so four Windows
      # packages would have arrived as `changji-windows-<ver>-setup.exe` and
      # three of them would have vanished without a word. The names carry the
      # target now, but the safe download costs nothing and the check below
      # means a future naming slip goes red instead of quiet.
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: raw

      - name: Flatten, and refuse to overwrite anything
        run: |
          set -euo pipefail
          mkdir -p dist
          clash=0
          while IFS= read -r f; do
            base=$(basename "$f")
            if [ -e "dist/$base" ]; then
              echo "::error::two cells produced $base"
              echo "  already here: $(ls -l "dist/$base" | awk '{print $5}') bytes"
              echo "  also at:      $f"
              clash=1
              continue
            fi
            mv "$f" "dist/$base"
          done < <(find raw -type f | sort)
          if [ "$clash" = 1 ]; then
            echo "Publishing now would ship one of each colliding pair and drop the rest,"
            echo "with nothing in the release notes to say which. Give the packaging"
            echo "scripts distinct names (CHANGJI_PKG_TARGET) and run again."
            exit 1
          fi
          rmdir raw/* raw 2>/dev/null || true

      - name: What is about to be published
        run: ls -la dist

      # ⚠️ **An unnotarised mac package must not ship.**
      #
      # A user who downloads an unnotarised `.dmg` cannot open it; macOS says
      # "is damaged and should be moved to the Bin" — wording identical to a
      # genuinely corrupt file, while nothing at this end reports anything at
      # all. Better that this run goes red.
      #
      # **This asks the artifact, not the configuration.** It used to test
      # `secrets.MACOS_CERT_P12 != ''`, which answers a different question: a
      # certificate with the notarisation secrets missing produces a signed,
      # unnotarised dmg that sailed straight through. The macOS cell now runs
      # `stapler validate` on the dmg it built and leaves `NOTARIZED` beside it
      # only if the ticket is really attached. (This job runs on Linux and has
      # no stapler of its own, which is why it arrives as a marker.)
      #
      # On a manual run in a fork with no secrets configured, the packages are
      # still downloadable from the run's artifacts; they just do not enter the
      # Release.
      - name: Gate — is the mac package notarized
        run: |
          set -e
          dmg=$(ls dist/*.dmg 2>/dev/null | head -1 || true)
          [ -n "$dmg" ] || { echo "no mac package in this run; skipping"; exit 0; }
          if [ -f dist/NOTARIZED ]; then
            echo "$(basename "$dmg") is notarized"
          else
            echo "::warning::$(basename "$dmg") is not notarized — removing it from the release."
            echo "Users cannot open it; it would tell them the download is damaged."
            rm -f dist/*.dmg
          fi
          rm -f dist/NOTARIZED

      - name: Create the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          VER: ${{ needs.meta.outputs.version }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
          # The resolved ref, not the raw input: on a push the input is
          # empty while what was actually used is the same-name pairing (or
          # the fallback). The notes have to name the version that went in.
          PRODUCT_REF: ${{ needs.meta.outputs.product_ref }}
        run: |
          set -e
          # Delete before creating: the tag would otherwise stay pinned to the
          # commit that first created it, and when a platform fails to build in
          # some run the previous run's package for that platform is still
          # sitting there — whoever is downloading cannot tell which is current
          # (the same passage as in the engine pipeline).
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag \
            || echo "no previous $TAG; skipping"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" --silent \
            || echo "no leftover tag; skipping"
          {
            if [ "$CHANNEL" = "beta" ]; then
              echo "**Rolling prerelease.** Built from the last branch push; the next one overwrites it."
              echo "For a proper release, look for a \`desktop-v\` entry under Releases."
              echo
            fi
            echo "Desktop \`$VER\`. **Separate from the engine release line** —"
            echo "this holds desktop installers only; the engine packages are in the v-prefixed Releases."
            echo
            echo "| OS | How to install |"
            echo "|---|---|"
            echo "| macOS | Download the \`.dmg\`, open it, drag the icon into Applications |"
            echo "| Windows | Download \`setup.exe\`, double-click, click through |"
            echo "| Linux | Download the \`.tar.gz\`, unpack it, run \`changji-desktop.sh\` inside |"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | ${GITHUB_SHA} |"
            # **The desktop shell itself comes from the other repository.**
            # The branch above is this repo's; when the run was triggered from
            # over there, that is the branch that actually changed, and without
            # this line the notes say "main" while the shell came from a
            # feature branch.
            [ -n "$PRODUCT_REF" ] && echo "| Shell and web UI from | \`$PRODUCT_REF\` |"
            echo "| Built | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } > body.md
          # Prerelease: `/releases/latest` does not point at it, so anyone
          # downloading still gets the tagged build by default.
          PRE=""
          [ "$CHANNEL" = "beta" ] && PRE="--prerelease"
          TITLE="Desktop $VER"
          [ "$CHANNEL" = "beta" ] && TITLE="Desktop beta (${GITHUB_REF_NAME})"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            $PRE \
            --title "$TITLE" \
            --notes-file body.md \
            dist/*
