# Web UI: build it, then bake it into a header. **Shared by the release
# pipeline and the desktop pipeline.**
#
# It is a reusable workflow (`workflow_call`) because it has two callers. The
# desktop pipeline needs it too — the engine inside that `.app` still serves
# the same web UI on its own port (on machines without the desktop shell, the
# web UI *is* the whole face of the product).
#
# ⚠️ **Why it is rebuilt every single run**: `bundled_webapp.inc.hpp` is
# checked in, so the build would succeed without regenerating it — **but then
# what ships is whatever the UI looked like the last time somebody remembered
# to run gen_webapp.py by hand.** The symptom is "the UI is the old one" while
# the version string, the HTTP API and the binary are all new. Nothing
# anywhere reports an error.

name: Web UI

on:
  workflow_call:
    inputs:
      product_ref:
        description: 'Which ref of the private product repo to build against. Blank = its default branch'
        type: string
        required: false

jobs:
  webapp:
    name: Web UI (build + bake into a header)
    runs-on: ubuntu-24.04
    steps:
      # One checkout: the product repo, whose own `cpp/` is what gets built
      # (see the meta job in release.yml).
      #
      # Layout that every path in these workflow files assumes:
      #
      #   changji/            <- the private product repo (webapp/, desktop/, brand/)
      #   changji/cpp/        <- the engine, as the product repo tracks it
      - name: Check out the product repo
        uses: actions/checkout@v4
        with:
          repository: integemjack/changji
          token: ${{ secrets.CHANGJI_PRODUCT_TOKEN }}
          # Empty means that repo's default branch, which is what a push to
          # THIS repo wants. A push to the product repo passes its own ref
          # through, or a branch there would silently be built against main.
          ref: ${{ inputs.product_ref }}
          path: changji


      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: changji/webapp/package-lock.json

      - name: Install dependencies
        working-directory: changji/webapp
        run: npm ci

      # The front-end tests run here: this is the only job that touches the
      # web UI at all, and it finishes far sooner than the six C++ builds.
      # A broken UI should not take half an hour to surface.
      - name: Test
        working-directory: changji/webapp
        run: npm test

      # The client's build script is `eslint src && vite build`, so a lint
      # failure means no bundle.
      - name: Build
        working-directory: changji/webapp
        run: npm run build

      - name: Bake into a header
        run: python3 changji/cpp/tools/gen_webapp.py

      - uses: actions/upload-artifact@v4
        with:
          name: bundled-webapp
          path: changji/cpp/src/http/bundled_webapp.inc.hpp
          retention-days: 1
