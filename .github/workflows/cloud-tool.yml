# The GPU-rental tool (changji-cloud): three standalone packages, published to
# its own Release.
#
# **Separate from the engine pipeline.** Two reasons:
#
#   1. In release.yml, SHA256SUMS and version.json both glob `changji-*`, and
#      version.json is **what the updater reads**. Put this tool's package in
#      that Release and update checking would see a GUI tool as a newer engine.
#   2. One engine push is ten cells and tens of core-hours; a one-line change
#      to this tool has no business dragging that along. So this pipeline only
#      runs when the tool itself changed (see paths).
#
# Three cells, one per operating system. For an Intel Mac or an ARM Linux, add
# a matrix row; nothing else needs to change.
#
# **The package is a standalone executable** — install it and run it, with no
# Python and no PySide6 to install first (PyInstaller one-file, a bit over
# a hundred megabytes, almost all of it the Qt runtime).
#
# ⚠️ The Windows package **keeps its console window**: without it the output of
# `--version` / `--selftest` has nowhere to go, and CI could only verify "it
# built" rather than "it runs" — two very different claims. The side benefit is
# that a startup crash shows its reason in that window.
#
# Unlike the other pipelines in this repository, this one needs **no second
# checkout**: `tools/autodl_gui.py` and its tests live here, not in the product
# repo.

name: GPU-rental tool

on:
  push:
    branches: ['**']
    tags: ['cloud-v*']
    # **Only when the tool itself changed.** Without this, a one-line C++ edit
    # would build three hundred-megabyte packages.
    paths:
      - 'tools/autodl_gui.py'
      - 'tools/tests/**'
      - 'tools/README-cloud.md'
      - '.github/workflows/cloud-tool.yml'
  workflow_dispatch:

concurrency:
  group: cloud-tool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- What this run is ----
  #
  # Same idea as the engine pipeline: version and destination worked out in one
  # place, read everywhere else. Deciding it in three places means three edits
  # for one change, and missing one shows up as "the version in the binary is
  # right, it just went to the wrong place".
  meta:
    name: Where this run goes
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/cloud-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "channel=release" >> "$GITHUB_OUTPUT"
          else
            branch="${GITHUB_REF#refs/heads/}"
            # Branch names can contain slashes (feature/xxx), which neither
            # filenames nor tags tolerate.
            echo "version=beta-${branch//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          fi

  # ---- Tests first; red means no packages ----
  #
  # The `--selftest` below verifies that **the package is alive**: are the Qt
  # plugins all there, do the four providers' forms build. **It cannot verify
  # correctness** — reading the wrong field for a spot price (measured: every
  # quote five times too high, and the number still looks plausible), sending a
  # request to the wrong endpoint, sorting the comparison table
  # lexicographically: to the self-test all of that is "everything is fine".
  # That layer is this job's business.
  #
  # Linux only: these tests are pure logic plus offscreen Qt, so they are
  # platform-independent and running them three times is time spent for
  # nothing.
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && python -m pip install PySide6-Essentials
      - name: Install the system libraries Qt needs at runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
                                  libglib2.0-0 libfontconfig1 libfreetype6
      # HOME points at a temporary directory: the tests move their own config
      # paths aside, but **if one of them ever forgets, it must not be able to
      # read anything belonging to the machine running CI**. The same holds
      # when running them locally.
      - name: Run
        run: |
          export CHANGJI_TEST_HOME="$(mktemp -d)"
          python tools/tests/run_all.py

  build:
    name: Build ${{ matrix.target }}
    needs: [meta, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      # One cell failing must not take the others down: three systems, three
      # sets of traps, and seeing all of them at once beats fixing one and
      # waiting another round.
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: linux-x64
            # 22.04 rather than 24.04: glibc 2.35 instead of 2.39, so the
            # result still runs on older distributions (same reason as the
            # engine pipeline).
            runner: ubuntu-22.04
          - target: windows-x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # PySide6 ships abi3 wheels, and 3.12 has all platforms covered.
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Essentials only: QtWidgets is in there, without dragging in
          # WebEngine / 3D and the rest.
          python -m pip install PySide6-Essentials pyinstaller

      # Offscreen needs a few system libraries too; without them the symptom is
      # "could not load the Qt platform plugin" — which does not say which one
      # is missing.
      - name: Install the system libraries Qt needs at runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
                                  libglib2.0-0 libfontconfig1 libfreetype6

      # Bake the version into the source. **Stop dead if it cannot be done**:
      # if that line's shape changes in the source and this quietly skips, every
      # package ships reporting `dev` while looking perfectly normal.
      - name: Bake the version into the source
        shell: bash
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib
          p = pathlib.Path("tools/autodl_gui.py")
          s = p.read_text(encoding="utf-8")
          old = 'VERSION = "dev"'
          assert old in s, 'the line VERSION = "dev" is not in the source; did its shape change?'
          p.write_text(s.replace(old, 'VERSION = "%s"' % os.environ["V"], 1),
                       encoding="utf-8")
          print("baked in:", os.environ["V"])
          PY

      - name: Package
        shell: bash
        run: |
          pyinstaller --onefile --noupx --clean --name changji-cloud \
            --exclude-module tkinter \
            tools/autodl_gui.py
          ls -lh dist/

      # ---- This cell is the point of the whole pipeline ----
      #
      # "It built" proves nothing: once PySide6 is frozen into a single file, a
      # missing Qt plugin or a missing shared library is discovered by
      # double-clicking — by which time somebody has already downloaded it.
      # So this runs **the package that was just built**, not the source.
      - name: Does the package run (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          got="$(./dist/changji-cloud --version)"
          echo "version: $got"
          [ "$got" = "$V" ] || { echo "version mismatch: $got != $V"; exit 1; }
          QT_QPA_PLATFORM=offscreen ./dist/changji-cloud --selftest

      - name: Does the package run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          $got = & dist/changji-cloud.exe --version
          Write-Host "version: $got"
          if ($got -ne $env:V) { throw "version mismatch: $got != $env:V" }
          $env:QT_QPA_PLATFORM = "offscreen"
          & dist/changji-cloud.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "the self-test did not pass" }

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p out stage
          cp dist/changji-cloud stage/
          cp tools/README-cloud.md stage/README.md
          tar -czf "out/changji-cloud-${{ matrix.target }}.tar.gz" -C stage .

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out, stage | Out-Null
          Copy-Item dist/changji-cloud.exe stage/
          Copy-Item tools/README-cloud.md stage/README.md
          Compress-Archive -Path stage/* -DestinationPath "out/changji-cloud-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: changji-cloud-${{ matrix.target }}
          path: out/*

  publish:
    name: Publish to ${{ needs.meta.outputs.channel == 'release' && 'Release' || 'the cloud-beta prerelease' }}
    needs: [meta, build]
    # All three cells have to pass. Unlike the engine pipeline, where the four
    # GPU cells depend on vendor download URLs and one rotting link should not
    # hold up a release: these three are entirely our own, so a failure here
    # means something is genuinely wrong.
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: cloud-tool-publish-${{ needs.meta.outputs.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: changji-cloud-*
          path: dist
          merge-multiple: true

      - name: Compute SHA256SUMS
        working-directory: dist
        run: |
          sha256sum changji-cloud-* | tee SHA256SUMS
          ls -lh

      # The table is generated from what is actually in dist/, not written by
      # hand: a cell that did not build is not listed, and anything listed is
      # guaranteed to open (same reason as the engine pipeline).
      - name: Write the release notes
        run: |
          {
            echo "A GPU-rental interface for four clouds: compare prices, start the"
            echo "cheapest one in a click, and pull the models in automatically on boot."
            echo ""
            echo "Unpack and run. No Python and no PySide6 to install first."
            echo ""
            echo "| OS | Package |"
            echo "|---|---|"
            for f in changji-cloud-macos-arm64.tar.gz:"macOS (Apple silicon)" \
                     changji-cloud-linux-x64.tar.gz:"Linux x64" \
                     changji-cloud-windows-x64.zip:"Windows x64"; do
              name="${f%%:*}"; os="${f#*:}"
              [ -f "dist/$name" ] && printf '| %s | `%s` |\n' "$os" "$name"
            done
            echo ""
            echo "The Windows package opens with a console window — leave it there;"
            echo "if startup goes wrong, the reason is printed in it."
          } > notes.md
          cat notes.md

      # beta is deleted and rebuilt: each run replaces the cloud-beta Release
      # and its tag, pointing at this commit. Otherwise it accumulates
      # artifacts from some branch six months ago, and **stale artifacts mixed
      # in are worse than none** — whoever is downloading cannot tell which is
      # current.
      - name: Replace the old beta
        if: needs.meta.outputs.channel == 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cloud-beta --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.channel == 'release' && needs.meta.outputs.version || 'cloud-beta' }}
          PRE: ${{ needs.meta.outputs.channel == 'beta' && '--prerelease' || '' }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GPU-rental tool ${{ needs.meta.outputs.version }}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            $PRE \
            dist/*
