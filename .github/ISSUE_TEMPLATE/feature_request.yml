name: Feature request · 功能建议
description: Something changji should do, or do differently. · 希望场记能做到的、或者换个做法的。
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you want to do · 想做什么
      description: Describe the film you're trying to make or the step you're stuck on, not the button you think is missing. · 说你想拍什么、卡在哪一步，不用说你觉得缺哪个按钮。
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it today · 现在怎么做的
      description: The workaround, if there is one, and what's wrong with it. · 现在的绕法（如果有），以及它哪儿不行。

  - type: textarea
    id: more
    attributes:
      label: Anything else · 补充
      description: Examples, references, other tools that do it. · 例子、参考、别的工具是怎么做的。
